server {
    listen 80;
    server_name localhost;

    # Where our built Angular files live (matches the COPY in the Containerfile)
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        # The magic line: try the exact file, then a directory,
        # and if NEITHER exists, fall back to index.html so Angular's
        # router can take over. This is what fixes the refresh-404.
        try_files $uri $uri/ /index.html;
    }
}