<nav class="navbar">
    <div class="navbar-brand">
      <a routerLink="/">🏢 Meeting Room Booking</a>
    </div>

    <div class="navbar-links">
      <a routerLink="/rooms" routerLinkActive="active"> Rooms </a>
      <a routerLink="/bookings" routerLinkActive="active"> Bookings </a>
      <a routerLink="/bookings/new" class="btn-book"> + New Booking </a>

      @if (authService.isLoggedIn()) {
        <span class="user-name"> 👤 {{ authService.currentUser()?.fullName }} </span>
        <button class="btn-logout" (click)="logout()"> Logout </button>
      } @else {
        <a routerLink="/login" class="btn-login">Sign In</a>
        <a routerLink="/register" class="btn-register">Register</a>
      }
    </div>
  </nav>
