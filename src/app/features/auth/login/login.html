<div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🏢</div>
        <h2>Meeting Room Booking</h2>
        <p>Sign in to manage bookings</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="form-group">
          <label for="email"> Email Address
            <span class="required">*</span>
          </label>
          <input id="email" type="email" formControlName="email" placeholder="you@company.com" autocomplete="email"
            [class.is-invalid]="isInvalid('email')"
            [class.is-valid]="isValid('email')" />
          @if (isInvalid('email')) {
            <span class="field-error">
              Valid email is required
            </span>
          }
        </div>

        <div class="form-group">
          <label for="password"> Password
            <span class="required">*</span>
          </label>
          <input id="password" type="password" formControlName="password" placeholder="Your password"
            autocomplete="current-password" [class.is-invalid]="isInvalid('password')" />
          @if (isInvalid('password')) {
            <span class="field-error">
              Password is required
            </span>
          }
        </div>

        @if (error) {
          <div class="alert alert-error">
            <span>⚠️</span>
            <span>{{ error }}</span>
          </div>
        }

        <button type="submit"class="btn-submit" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span>
            Signing in...
          } @else {
            Sign In
          }
        </button>

        <div class="auth-divider">
          <span>Don't have an account?</span>
        </div>

        <a routerLink="/register"
          class="btn-secondary-link">
          Create an account
        </a>

      </form>
    </div>
  </div>
